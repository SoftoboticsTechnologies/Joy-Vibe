<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;} a{text-decoration:none;}
  .jv-nav{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;padding:14px clamp(20px,5vw,64px);}
  .jv-nav-links{display:flex;align-items:center;flex-wrap:wrap;gap:26px;}
  .jv-nav-logo{width:190px;height:58px;}
  .jv-nav-cta{white-space:nowrap;}
  .jv-nav-toggle-input{position:absolute;opacity:0;pointer-events:none;}
  .jv-nav-toggle{display:none;width:44px;height:40px;border:1px solid rgba(124,77,255,.18);border-radius:12px;background:#fff;cursor:pointer;align-items:center;justify-content:center;}
  .jv-nav-toggle-bars,.jv-nav-toggle-bars::before,.jv-nav-toggle-bars::after{display:block;width:20px;height:2px;border-radius:2px;background:#7C4DFF;transition:transform .2s ease,background .2s ease;content:"";}
  .jv-nav-toggle-bars{position:relative;}
  .jv-nav-toggle-bars::before{position:absolute;top:-7px;}
  .jv-nav-toggle-bars::after{position:absolute;top:7px;}
  .jv-nav-toggle-input:checked + .jv-nav-toggle .jv-nav-toggle-bars{background:transparent;}
  .jv-nav-toggle-input:checked + .jv-nav-toggle .jv-nav-toggle-bars::before{transform:translateY(7px) rotate(45deg);}
  .jv-nav-toggle-input:checked + .jv-nav-toggle .jv-nav-toggle-bars::after{transform:translateY(-7px) rotate(-45deg);}
  .jv-sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  @media (max-width:820px){
    .jv-nav{position:relative;justify-content:space-between;gap:12px 22px;padding:10px 20px 14px;}
    .jv-nav-brand{position:absolute;left:50%;transform:translateX(-50%);}
    .jv-nav-logo{width:170px;height:52px;object-position:center center!important;}
    .jv-nav-toggle{display:flex;order:2;}
    .jv-nav-links{display:none;flex-direction:column;align-items:center;gap:14px;order:3;width:100%;padding:16px 0 8px;border-top:1px solid rgba(124,77,255,.1);}
    .jv-nav-toggle-input:checked ~ .jv-nav-links{display:flex;}
    .jv-nav-cta{display:block;order:1;width:auto;text-align:center;}
  }
  @media (max-width:480px){
    .jv-nav{gap:8px 14px;padding-inline:14px;}
    .jv-nav-logo{width:145px;height:46px;object-position:center center!important;}
    .jv-nav-links{gap:7px 12px;}
    .jv-nav-links a{font-size:14px!important;}
    .jv-nav-cta{font-size:13px!important;padding:9px 15px!important;}
  }
</style>
</helmet>
<nav class="jv-nav" style="background:rgba(255,253,251,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(124,77,255,.08);font-family:'Inter',sans-serif;">
  <a class="jv-nav-brand" href="index.html" style="display:flex;align-items:center;">
    <img class="jv-nav-logo" src="joyvibe-logo-transparent.png" alt="JoyVibe" style="display:block;object-fit:contain;object-position:left center;">
  </a>
  <input class="jv-nav-toggle-input" type="checkbox" id="jv-nav-menu-toggle">
  <label class="jv-nav-toggle" for="jv-nav-menu-toggle" aria-label="Toggle navigation menu">
    <span class="jv-nav-toggle-bars" aria-hidden="true"></span>
    <span class="jv-sr-only">Menu</span>
  </label>
  <div class="jv-nav-links">
    <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
      <a href="{{ l.href }}" style="font-size:15px;color:{{ l.color }};font-weight:{{ l.weight }};padding-bottom:2px;border-bottom:2px solid {{ l.underline }};">{{ l.label }}</a>
    </sc-for>
  </div>
  <a class="jv-nav-cta" href="contact.html" style="font-family:'Poppins';font-weight:600;font-size:14px;color:#fff;padding:11px 22px;border-radius:20px;background:linear-gradient(135deg,#FF5FA2,#FFA726,#7C4DFF);box-shadow:0 8px 20px rgba(255,95,162,.35);">Book Event</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:72},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;services&quot;,&quot;occasions&quot;,&quot;portfolio&quot;,&quot;about&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active;
    const mk = (label, href, key) => ({
      label, href,
      color: a === key ? "#7C4DFF" : "#4a4360",
      weight: a === key ? "700" : "500",
      underline: a === key ? "#FF5FA2" : "transparent",
    });
    return { links: [
      mk("Home","index.html","home"),
      mk("Services","services.html","services"),
      mk("Occasions","occasions.html","occasions"),
      mk("Portfolio","portfolio.html","portfolio"),
      mk("About Us","about.html","about"),
      mk("Contact","contact.html","contact"),
    ]};
  }
}
</script>
</body>
</html>
