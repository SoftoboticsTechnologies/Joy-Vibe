<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>*{box-sizing:border-box;}</style>
</helmet>

<sc-if value="{{ isBadge }}" hint-placeholder-val="{{ true }}">
  <img src="joyvibe-logo.jpeg" alt="JoyVibe — Stress-Free Celebrations, Beautiful Memories" style="display:block;width:100%;height:auto;object-fit:contain;">
</sc-if>

<sc-if value="{{ isLockup }}" hint-placeholder-val="{{ false }}">
  <img src="joyvibe-logo.jpeg" alt="JoyVibe — Stress-Free Celebrations, Beautiful Memories" style="display:block;width:190px;height:58px;object-fit:contain;object-position:left center;">
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:250},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;badge&quot;,&quot;lockup&quot;],&quot;default&quot;:&quot;badge&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant || "badge";
    return { isBadge: v === "badge", isLockup: v === "lockup" };
  }
}
</script>
</body>
</html>
